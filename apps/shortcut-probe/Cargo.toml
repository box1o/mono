[package]
name = "shortcut-probe"
version = "0.1.0"
description = "Global shortcut portal event probe"
edition = "2021"
rust-version = "1.85"

[dependencies]
ashpd = { version = "0.13.12", default-features = false, features = ["global_shortcuts", "tokio"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

