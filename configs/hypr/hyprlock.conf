$bg = rgba(181616ff)
$fg = rgba(c5c9c5ff)
$muted = rgba(727169ff)
$line = rgba(2d2a2eff)
$accent = rgba(8ba4b0aa)
$accent_dim = rgba(54546dcc)
$red = rgba(c4746eff)

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fractional_scaling = 2
    fail_timeout = 1800
}

animations {
    enabled = true
    bezier = ease, 0.05, 0.9, 0.1, 1.0
    animation = fade, 1, 2, ease
    animation = inputFieldFade, 1, 2, ease
    animation = inputFieldColors, 1, 2, ease
}

auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = false
}

background {
    monitor =
    path = ~/.config/hypr/img/anime-back.jpg
    color = $bg
    blur_passes = 2
    blur_size = 6
    noise = 0.008
    contrast = 0.92
    brightness = 0.45
    vibrancy = 0.08
    vibrancy_darkness = 0.04
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 82
    font_family = JetBrains Mono ExtraBold
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $muted
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 42
    outline_thickness = 1
    outer_color = rgba(625e5acc)
    inner_color = rgba(181616aa)
    font_color = $fg
    check_color = $accent
    fail_color = $red
    capslock_color = rgba(c4b28acc)
    dots_size = 0.18
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = password
    fail_text = $FAIL
    rounding = 4
    position = 0, -95
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $muted
    font_size = 11
    font_family = JetBrains Mono
    position = 0, -150
    halign = center
    valign = center
}
