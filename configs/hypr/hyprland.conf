# paths
$script = $HOME/.local/share/bin

# colors
$accent = rgba(8ba4b0cc)
$accent_dim = rgba(625e5acc)
$border = rgba(2d2a2ecc)
$border_active = rgba(625e5acc)
$shadow = rgba(00000055)

# apps
$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus
$browser = zen-browser --blank-window
$launcher = $script/rofi.sh
$runnit = $script/runnit

# monitors
monitor = HDMI-A-1, 1920x1200@59.95, 0x0, 1
monitor = eDP-2, 1920x1080@144.06, 0x1200, 1

# environment
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = _JAVA_AWT_WM_NONREPARENTING,1

env = GTK_FONT_NAME,Adwaita Sans 11
env = QT_FONT_NAME,Adwaita Sans
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,Breeze
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# startup
exec-once = $script/desktop-services.sh

exec-once = nm-applet
exec-once = blueman-applet
exec-once = waybar
exec-once = $script/wallpaper-picker.sh --restore
exec-once = dunst
exec-once = $script/theme.sh apply
exec-once = wl-paste --watch cliphist store

# appearance
general {
    gaps_in = 1
    gaps_out = 2
    border_size = 1

    col.active_border = $border_active
    col.inactive_border = $border

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 4

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = $shadow
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.08
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 2.5, myBezier
    animation = windowsOut, 1, 2.5, default, popin 80%
    animation = border, 1, 3.5, default
    animation = borderangle, 1, 2.8, default
    animation = fade, 1, 2.5, default
    animation = workspaces, 1, 2.2, default
}

# layout
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# input
input {
    kb_layout = us
    kb_options = caps:swapescape

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# rules
windowrule = match:title ^(dcmd)$, float true
windowrule = match:title ^(dcmd)$, center true
windowrule = match:title ^(dcmd)$, size 1300 850

windowrule = match:class ^(Runnit)$, float true
windowrule = match:class ^(Runnit)$, center true
windowrule = match:class ^(Runnit)$, size 75% 75%

windowrule = match:class ^(Rofi)$, float true
windowrule = match:class ^(Rofi)$, center true

windowrule = match:class ^(scrcpy)$, float true

windowrule = match:class ^(pavucontrol|org\.pulseaudio\.pavucontrol)$, float true
windowrule = match:class ^(pavucontrol|org\.pulseaudio\.pavucontrol)$, center true
windowrule = match:class ^(pavucontrol|org\.pulseaudio\.pavucontrol)$, size 760 520

windowrule = match:class ^(kicad)$, float true
windowrule = match:class ^(org\.freecad\.FreeCAD)$, float true
windowrule = match:class ^(org\.gnome\.Nautilus|nautilus)$, float true
windowrule = match:class ^(Spotify|spotify)$, float true
windowrule = match:class ^(org\.gnome\.(Calendar|Calculator|Clocks|Weather|Characters|Logs|DiskUtility|FontViewer|Loupe|TextEditor|Snapshot))$, float true
windowrule = match:class ^(gnome-disks|nm-connection-editor|blueman-manager|blueman-adapters|system-config-printer)$, float true
windowrule = match:class ^(qt5ct|qt6ct|kvantummanager|systemsettings|plasma-systemmonitor)$, float true
windowrule = match:class ^(easyeffects|com\.github\.wwmm\.easyeffects|helvum|org\.pipewire\.Helvum|qpwgraph|org\.rncbc\.qpwgraph)$, float true

windowrule = match:modal true, float true
windowrule = match:modal true, center true

windowrule = match:class ^(Bitwarden|bitwarden|Spotify|spotify|pavucontrol|org\.pulseaudio\.pavucontrol|org\.gnome\.Calculator)$, workspace special:magic silent

# app hotkeys
bind = Alt SHIFT, A, exec, $launcher
bind = Alt SHIFT, D, exec, $terminal
bind = Alt SHIFT, S, exec, $browser
bind = Alt SHIFT, F, exec, $fileManager
bind = Alt SHIFT, R, exec, $runnit

# script hotkeys
bind = Alt, V, exec, $script/clipboard.sh
bind = $mainMod SHIFT, B, exec, $script/pipfolow.sh
bind = $mainMod SHIFT, K, exec, $terminal -e $script/pkg.sh
bind = $mainMod SHIFT, R, exec, $terminal -e $script/rdp.sh
bind = $mainMod, R, exec, $script/waybar.sh
bind = $mainMod, L, exec, $script/win-vm.sh
bind = $mainMod SHIFT, W, exec, $script/wallpaper-picker.sh
bind = $mainMod SHIFT, T, exec, $script/theme.sh toggle
bind = $mainMod SHIFT, O, exec, $script/portal-restart.sh

# session hotkeys
bind = Alt SHIFT, C, exec, $script/close-hovered-window.sh
bind = $mainMod, M, exec, $script/session.sh menu
bind = $mainMod SHIFT, P, exec, hyprpicker -a
bind = $mainMod SHIFT, I, exec, $script/image-colors.sh
bind = Alt, Q, exec, $script/session.sh lock
bind = Alt SHIFT, Q, exec, wlogout

# utility hotkeys
bind = Alt, N, exec, kitty -e nmtui

# window hotkeys
bind = Alt, W, togglefloating,
bind = Alt SHIFT, W, fullscreen,

bindm = Alt, mouse:272, movewindow
bindm = Alt, mouse:273, resizewindow
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# focus hotkeys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# workspace hotkeys
bind = Alt, 1, workspace, 1
bind = Alt, 2, workspace, 2
bind = Alt, 3, workspace, 3
bind = Alt, 4, workspace, 4
bind = Alt, 5, workspace, 5
bind = Alt, 6, workspace, 6
bind = Alt, 7, workspace, 7
bind = Alt, 8, workspace, 8
bind = Alt, 9, workspace, 9
bind = Alt, 0, workspace, 10

bind = Alt SHIFT, 1, movetoworkspace, 1
bind = Alt SHIFT, 2, movetoworkspace, 2
bind = Alt SHIFT, 3, movetoworkspace, 3
bind = Alt SHIFT, 4, movetoworkspace, 4
bind = Alt SHIFT, 5, movetoworkspace, 5
bind = Alt SHIFT, 6, movetoworkspace, 6
bind = Alt SHIFT, 7, movetoworkspace, 7
bind = Alt SHIFT, 8, movetoworkspace, 8
bind = Alt SHIFT, 9, movetoworkspace, 9
bind = Alt SHIFT, 0, movetoworkspace, 10

bind = $mainMod, N, togglespecialworkspace, magic
bind = $mainMod SHIFT, N, movetoworkspace, special:magic

bind = Alt, mouse_down, workspace, e+1
bind = Alt, mouse_up, workspace, e-1

# audio hotkeys
bindl = , XF86AudioMute, exec, $script/volumecontrol.sh m
bindel = , XF86AudioLowerVolume, exec, $script/volumecontrol.sh d
bindel = , XF86AudioRaiseVolume, exec, $script/volumecontrol.sh i

# media hotkeys
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# brightness hotkeys
bindel = , XF86MonBrightnessUp, exec, $script/brightnesscontrol.sh i
bindel = , XF86MonBrightnessDown, exec, $script/brightnesscontrol.sh d

# screenshot hotkeys
bind = , Print, exec, $script/screenshot.sh d
bind = $mainMod, P, exec, $script/screenshot.sh p
bind = $mainMod SHIFT, S, exec, $script/screenshot.sh w
bind = $mainMod SHIFT, E, exec, $script/screenshot.sh edit
