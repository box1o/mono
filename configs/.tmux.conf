# -----------------------------
# Terminal / general
# -----------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
set -g escape-time 0

# -----------------------------
# Prefix
# -----------------------------
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# -----------------------------
# Pane navigation
# -----------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -----------------------------
# Splits (preserve cwd)
# -----------------------------
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# -----------------------------
# Reload config
# -----------------------------
unbind r
bind R source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux.conf reloaded"

# -----------------------------
# Rename window
# -----------------------------
bind r command-prompt -I "#W" "rename-window '%%'"

# -----------------------------
# Indexing
# -----------------------------
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# -----------------------------
# Disable auto rename
# -----------------------------
set -g automatic-rename off
set -g allow-rename off

# -----------------------------
# Copy mode
# -----------------------------
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# -----------------------------
# Alt navigation (nvim aware)
# -----------------------------
bind -n M-h if-shell 'tmux display -p "#{pane_current_command}" | grep -iq nvim' 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell 'tmux display -p "#{pane_current_command}" | grep -iq nvim' 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell 'tmux display -p "#{pane_current_command}" | grep -iq nvim' 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell 'tmux display -p "#{pane_current_command}" | grep -iq nvim' 'send-keys M-l' 'select-pane -R'

# -----------------------------
# Alt + number → windows
# -----------------------------
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# -----------------------------
# Theme: Kanagawa Dragon
# -----------------------------
thm_bg="#181616"
thm_fg="#c5c9c5"
thm_gray="#393836"
thm_muted="#727169"
thm_black4="#625e5a"
thm_accent="#8ba4b0"

thm_active_bg="#282727"
thm_inactive_bg="#0d0c0c"

# -----------------------------
# Status bar
# -----------------------------
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-bg "${thm_bg}"
set -g status-fg "${thm_fg}"
set -g status-left-length 0
set -g status-right-length 80
set -g status-left ""
set -g status-right "#[fg=${thm_fg},bg=${thm_bg}]#S #[fg=${thm_muted}]%H:%M"

# -----------------------------
# Messages
# -----------------------------
set -g message-style "fg=${thm_fg},bg=${thm_active_bg}"
set -g message-command-style "fg=${thm_fg},bg=${thm_active_bg}"

# -----------------------------
# Pane borders
# -----------------------------
set -g pane-border-status off
set -g pane-border-lines single
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_black4}"

# -----------------------------
# Window styles (minimal, no noise)
# -----------------------------
set -g window-status-separator ""

set -g window-status-format "#[fg=${thm_black4},bg=${thm_bg}]#I:#W"
set -g window-status-current-format "#[fg=${thm_fg},bg=${thm_active_bg},bold]#I:#W"

# -----------------------------
# Modes
# -----------------------------
set -g clock-mode-colour "#8ba4b0"
set -g mode-style "fg=${thm_fg},bg=${thm_active_bg},bold"

# -----------------------------
# Plugins
# -----------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# -----------------------------
# Persistence
# -----------------------------
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @continuum-boot 'on'

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'ssh nvim vim zsh bash fish'
set -g @resurrect-capture-pane-contents 'on'

# -----------------------------
# Save / restore
# -----------------------------
bind S run-shell "~/.tmux/plugins/tmux-resurrect/scripts/save.sh" \; display-message "Session saved"
bind P run-shell "~/.tmux/plugins/tmux-resurrect/scripts/restore.sh" \; display-message "Session restored"

# -----------------------------
# TPM init
# -----------------------------
run '~/.tmux/plugins/tpm/tpm'
